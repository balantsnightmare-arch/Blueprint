<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Profile Hub</h1>
      <p class="muted">Change your profile once, update it everywhere.</p>
    </header>

    <div id="error" class="banner" hidden></div>

    <section class="accounts">
      <div id="account-row" class="account-row">
        <button id="add-account" class="circle add" aria-label="Add an account">+</button>
      </div>
      <p id="account-hint" class="hint center"></p>
      <div id="account-detail" class="account-detail" hidden></div>
    </section>

    <section class="editor">
      <div class="avatar-picker">
        <label class="avatar-circle" title="Choose a new picture">
          <img id="avatar-img" alt="" hidden />
          <span id="avatar-placeholder" class="avatar-placeholder">Add picture</span>
          <span class="avatar-overlay">Change</span>
          <input id="avatar-input" type="file" accept="image/png,image/jpeg,image/webp" hidden />
        </label>
        <span id="avatar-tag" class="tag" hidden>New</span>
        <button id="avatar-undo" class="link" hidden>Keep current picture</button>
      </div>

      <div class="bio-box">
        <label for="bio" class="label">Bio</label>
        <textarea id="bio" rows="6" placeholder="Write your bio once…"></textarea>
        <div class="bio-footer">
          <span id="bio-count" class="hint"></span>
          <label class="check"><input type="checkbox" id="update-bio" checked /> Update bio</label>
        </div>
      </div>
    </section>

    <div class="apply-row">
      <button id="apply" disabled>Update profiles</button>
    </div>
    <ul id="results" class="results"></ul>
  </main>

  <dialog id="add-dialog">
    <div class="dialog-head">
      <h2>Add an account</h2>
      <button class="icon-btn" data-close aria-label="Close">×</button>
    </div>

    <div id="platform-list" class="platform-list"></div>

    <form id="bluesky-form" class="stack" hidden>
      <p class="muted">Use an <a href="https://bsky.app/settings/app-passwords" target="_blank" rel="noopener">app password</a>, not your real password.</p>
      <input name="handle" placeholder="you.bsky.social" autocomplete="username" required />
      <input name="appPassword" type="password" placeholder="App password" autocomplete="current-password" required />
      <div class="row">
        <button type="button" class="secondary" data-back>Back</button>
        <button type="submit">Connect Bluesky</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
